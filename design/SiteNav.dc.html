<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  a { color: #1b3f7a; text-decoration: none; }
  a:hover { color: #9e1b32; }
</style>
</helmet>
<header style="background:#ffffff; border-bottom:1px solid #e6e3dc; font-family:Manrope, system-ui, sans-serif;">
  <div style="display:flex; align-items:center; gap:28px; padding:0 40px; height:76px; max-width:1480px; margin:0 auto;">
    <span style="display:flex; align-items:center; background:#16305e; border-radius:11px; padding:7px 13px; flex:0 0 auto;"><img src="src/assets/logo.png" alt="Alfraganus University Library" style="height:26px; width:auto; display:block;" /></span>
    <nav style="display:flex; align-items:center; gap:4px; margin-left:8px; flex:0 0 auto;">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
        <sc-if value="{{ item.active }}" hint-placeholder-val="{{ false }}">
          <span style="display:flex; align-items:center; gap:7px; padding:9px 14px; border-radius:10px; background:#eef1f7; color:#16305e; font-size:14.5px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap; flex:0 0 auto;">
            <span style="width:5px; height:5px; border-radius:50%; background:#9e1b32;"></span>
            {{ item.label }}
          </span>
        </sc-if>
        <sc-if value="{{ item.inactive }}" hint-placeholder-val="{{ true }}">
          <span style="display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:10px; color:#4a5872; font-size:14.5px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; flex:0 0 auto; cursor:pointer;" style-hover="background:#f4f3ef; color:#16305e;">
            {{ item.label }}
            <sc-if value="{{ item.caret }}" hint-placeholder-val="{{ false }}">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6" /></svg>
            </sc-if>
          </span>
        </sc-if>
      </sc-for>
    </nav>

    <div style="flex:1;"></div>

    <div style="display:flex; align-items:center; gap:10px; flex:0 1 auto; min-width:0;">
      <label style="display:flex; align-items:center; gap:9px; height:40px; padding:0 14px 0 13px; border:1px solid #e6e3dc; border-radius:999px; background:#faf9f6; width:200px; min-width:0; flex:0 1 auto;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a93a6" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4.2-4.2" /></svg>
        <span style="font-size:13.5px; color:#8a93a6; font-weight:500;">Kitob, muallif, ISBN…</span>
        <span style="margin-left:auto; font-size:10.5px; font-weight:700; color:#a7aebd; border:1px solid #e6e3dc; border-radius:5px; padding:2px 5px; background:#fff;">⌘K</span>
      </label>

      <div style="display:flex; align-items:center; height:40px; padding:3px; gap:2px; border:1px solid #e6e3dc; border-radius:999px; background:#faf9f6;">
        <span style="display:flex; align-items:center; gap:6px; padding:0 11px; height:32px; border-radius:999px; background:#16305e; color:#fff; font-size:12.5px; font-weight:700;">UZ</span>
        <span style="display:flex; align-items:center; padding:0 9px; height:32px; border-radius:999px; color:#7b8497; font-size:12.5px; font-weight:600;">RU</span>
        <span style="display:flex; align-items:center; padding:0 9px; height:32px; border-radius:999px; color:#7b8497; font-size:12.5px; font-weight:600;">EN</span>
      </div>

      <span style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border:1px solid #e6e3dc; border-radius:999px; background:#faf9f6; color:#16305e;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      </span>

      <sc-if value="{{ showAdmin }}" hint-placeholder-val="{{ false }}">
        <span style="display:flex; align-items:center; gap:7px; height:40px; padding:0 15px; border-radius:999px; background:#fdf0f2; border:1px solid #f2ced5; color:#9e1b32; font-size:13.5px; font-weight:700;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
          {{ adminLabel }}
        </span>
      </sc-if>

      <sc-if value="{{ isGuest }}" hint-placeholder-val="{{ false }}">
        <span style="display:flex; align-items:center; height:40px; padding:0 20px; border-radius:999px; background:#16305e; color:#fff; font-size:13.5px; font-weight:700;">Kirish</span>
      </sc-if>
      <sc-if value="{{ isUser }}" hint-placeholder-val="{{ true }}">
        <span style="display:flex; align-items:center; gap:9px; height:40px; padding:3px 14px 3px 3px; border-radius:999px; background:#f4f3ef; border:1px solid #e6e3dc;">
          <span style="width:32px; height:32px; border-radius:50%; background:#16305e; color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;">{{ initials }}</span>
          <span style="font-size:13px; font-weight:700; color:#16305e;">{{ userName }}</span>
        </span>
      </sc-if>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:76},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;books&quot;,&quot;sections&quot;,&quot;top&quot;,&quot;feedback&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;guest&quot;,&quot;student&quot;,&quot;teacher&quot;,&quot;librarian&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;student&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Aziza S.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AS&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "home";
    const role = this.props.role ?? "student";
    const defs = [
      { key: "home", label: "Bosh sahifa" },
      { key: "books", label: "Kutubxona" },
      { key: "sections", label: "Bo'limlar", caret: true },
      { key: "top", label: "Top kitoblar" },
      { key: "feedback", label: "Fikr-mulohaza" },
    ];
    const adminLabels = { teacher: "Kitob qo'shish", librarian: "Boshqaruv paneli", admin: "Boshqaruv paneli" };
    return {
      items: defs.map(d => ({ ...d, active: d.key === active, inactive: d.key !== active, caret: !!d.caret })),
      showAdmin: !!adminLabels[role],
      adminLabel: adminLabels[role] || "",
      isGuest: role === "guest",
      isUser: role !== "guest",
      initials: this.props.initials ?? "AS",
      userName: this.props.userName ?? "Aziza S.",
    };
  }
}
</script>
</body>
</html>
